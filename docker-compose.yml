services:
  whisperlive-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu_tensorrt
    container_name: whisperlive-server-gpu
    runtime: nvidia
    ports:
      - "5206:9090"  # External:Internal port mapping
    environment:
      # GPU Configuration
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0

      # TensorRT Backend Configuration
      - TRT_MODEL_PATH=/app/models/whisper_large_v3_float16
      - TRT_MULTILINGUAL=true
      - TRT_PY_SESSION=false  # Use C++ session for better performance

      # API Authentication
      - API_KEY=your-secret-api-key-change-in-production

      # LLM Configuration for Summarization (Optional)
      # For local Ollama:
      # - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # - OLLAMA_MODEL=qwen2.5:latest
      # OLLAMA_API_KEY not required for local Ollama

      # For external vLLM API (uncomment and set your values):
      - OLLAMA_BASE_URL=https://ollama-ui-llm-service.agents.1t.ru/api
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - OLLAMA_MODEL=vllm.Qwen3-80B-A3B-Thinking-int4

      # Session Configuration
      - SESSION_TTL=3600          # Session time-to-live in seconds (1 hour)
      - CLEANUP_INTERVAL=60       # Cleanup interval in seconds

      # Storage Configuration
      - REDIS_URL=redis://redis:6379/0
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DATABASE=whisperlive
      - ENABLE_STORAGE=true       # Enable Redis/MongoDB storage

      # Rate Limiting Configuration
      - ENABLE_RATE_LIMIT=true    # Enable rate limiting
      - RATE_LIMIT_REDIS_URL=redis://redis:6379/1  # Separate Redis DB for rate limiting

      # CPU Optimization
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4

      # Debug mode (set to 1 to enable detailed WebSocket message logging)
      - DEBUG=1

      # Proxy settings (if needed)
      # - https_proxy=http://proxy.example.com:8080
      # - http_proxy=http://proxy.example.com:8080
      # - no_proxy=localhost,127.0.0.1

    volumes:
      # TensorRT engines storage
      - ./trt_engines:/app/models
      - ./assets:/app/assets
      # Whisper model cache
      - ./models:/root/.cache/huggingface/hub

      # Prompt configuration
      - ./prompt.yaml:/app/prompt.yaml:ro

    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy

    restart: unless-stopped

    # Resource limits (adjust based on your system)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: whisperlive-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis-data:/data
    restart: unless-stopped

    # Health check
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  mongodb:
    image: mongo:7
    container_name: whisperlive-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=whisperlive
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    restart: unless-stopped

    # Health check
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  redis-data:
    driver: local
  mongodb-data:
    driver: local
  mongodb-config:
    driver: local
